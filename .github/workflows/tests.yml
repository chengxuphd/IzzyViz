name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install CPU-only torch
        # The default wheel pulls ~2 GB of CUDA that CI never uses.
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install package and dev extras
        run: pip install -e ".[dev]"

      - name: Run tests
        # MPLBACKEND is belt-and-braces; conftest.py also forces Agg.
        env:
          MPLBACKEND: Agg
        run: pytest tests/ -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      # Non-blocking for now: the existing code has pre-existing findings that
      # are out of scope for this pass. Remove --exit-zero once they are fixed.
      - run: ruff check . --output-format=github --exit-zero
